[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-ai-training-framework"
version = "0.1.0"
description = "A beginner-friendly local framework for image model training"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "Pillow>=10",
    "PyYAML>=6",
    "matplotlib>=3.8",
    "streamlit>=1.35",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["uatf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
