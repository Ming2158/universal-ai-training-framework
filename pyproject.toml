[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-ai-training-framework"
version = "2.0.0"
description = "A beginner-friendly local framework for image model training"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "Pillow>=10",
    "PyYAML>=6",
    "matplotlib>=3.8",
    "gradio>=4.44",
]

[project.scripts]
uatf = "uatf.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.14"]
monitor = ["psutil>=5.9", "nvidia-ml-py>=12"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.packages.find]
include = ["uatf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
