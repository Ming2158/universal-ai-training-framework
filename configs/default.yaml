# Example only; paths and training components become usable as V1 is implemented.
task:
  type: image_classification

dataset:
  format: image_folder
  train_dir: datasets/example/train
  validation_dir: datasets/example/validation
  annotations_csv: null
  image_dir: null

model:
  name: resnet50
  pretrained: false
  num_classes: 14

training:
  seed: 42
  epochs: 10
  batch_size: 32
  learning_rate: 0.001
  num_workers: 0
  amp:
    enabled: false
  scheduler:
    enabled: false
    name: step_lr
    step_size: 5
    gamma: 0.1
  early_stopping:
    enabled: false
    patience: 5
    min_delta: 0.0

evaluation:
  primary_metric: accuracy

output:
  directory: outputs
