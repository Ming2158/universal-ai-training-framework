# Reference defaults. The CLI uses the matching DEFAULT_CONFIG in uatf.config.
task:
  type: classification

dataset:
  validation_fraction: 0.2
  image_size: 224
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  augmentation:
    enabled: false
    horizontal_flip_probability: 0.5
    rotation_degrees: 0.0
    brightness: 0.0
    contrast: 0.0
    saturation: 0.0
    hue: 0.0

model:
  name: resnet50
  pretrained: false

training:
  seed: 42
  epochs: 10
  batch_size: 32
  learning_rate: 0.001
  num_workers: 0
  device: auto
  loss:
    name: auto
  optimizer:
    name: adam
    weight_decay: 0.0
  gradient_accumulation_steps: 1
  gradient_clip_norm: null
  resume_from: null
  monitor: val_loss
  amp:
    enabled: false
  scheduler:
    enabled: false
    name: step_lr
    step_size: 5
    gamma: 0.1
  early_stopping:
    enabled: false
    patience: 5
    min_delta: 0.0

evaluation:
  primary_metric: accuracy
  threshold: 0.5

output:
  directory: outputs
  save_predictions: true
  save_plots: true
